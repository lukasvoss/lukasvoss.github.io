  <script>
    // Initialize the map centered at [20, 0] with a zoom level of 2 for a global view.
    var map = L.map('map').setView([20, 0], 2);

    // Add the OpenStreetMap tile layer.
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Define an array of engagement objects.
    var engagements = [
    {
      lat: 48.4011, lng: 10.0027,
      text: "<b>Ulm, Germany</b><br>Double Master's degree (2x MSc) in Physics and Management from Ulm University."
    },
    {
      lat: 28.6139, lng: 77.2090,
      text: "<b>New Delhi, India</b><br>Exchange Student."
    },
    {

    // Loop through the engagements array and add markers with popups.
    // Loop through the engagements array and add markers with the formatted popups.
    engagements.forEach(function(eng) {
        var marker = L.marker([eng.lat, eng.lng]).addTo(map);
        marker.bindPopup(eng.text);
    });
